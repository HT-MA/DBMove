apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbmove.name" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: dbmove-api
    {{- include "dbmove.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dbmove-api
  template:
    metadata:
      labels:
        app: dbmove-api
        {{- include "dbmove.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}-api:{{ .Values.image.apiTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "dbmove.name" . }}-config
            - secretRef:
                name: {{ include "dbmove.name" . }}-secret
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbmove.name" . }}-web
  namespace: {{ .Values.namespace }}
  labels:
    app: dbmove-web
    {{- include "dbmove.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dbmove-web
  template:
    metadata:
      labels:
        app: dbmove-web
        {{- include "dbmove.labels" . | nindent 8 }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}-web:{{ .Values.image.webTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
              name: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
