apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbmove.name" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dbmove.labels" . | nindent 4 }}
type: Opaque
stringData:
  DBMOVE_ENCRYPTION_KEY: {{ .Values.api.encryptionKey | quote }}
  DBMOVE_INTERNAL_TOKEN: {{ .Values.api.internalToken | quote }}
